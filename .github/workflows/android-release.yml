name: HyperDeX Polyglot Release (Kotlin + Rust + C11 + C++20)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK 26 & CMake
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build Custom Rust Native Library (librust_hypercore.so)
        env:
          HYPERDEX_BUILD_PEPPER: ${{ secrets.OFFICIAL_HMAC_PEPPER }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          NDK_BIN="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          export AR="$NDK_BIN/llvm-ar"

          cd rust_hypercore
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android
          cd ..

          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          cp rust_hypercore/target/aarch64-linux-android/release/librust_hypercore.so app/src/main/jniLibs/arm64-v8a/
          cp rust_hypercore/target/armv7-linux-androideabi/release/librust_hypercore.so app/src/main/jniLibs/armeabi-v7a/
          cp rust_hypercore/target/x86_64-linux-android/release/librust_hypercore.so app/src/main/jniLibs/x86_64/
          "$NDK_BIN/llvm-strip" --strip-unneeded app/src/main/jniLibs/*/*.so

      - name: Prepare Official Release Keystore (GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hyperdex-release.p12"
            keytool -list -keystore "$RUNNER_TEMP/hyperdex-release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASS" > /dev/null
            echo "KEYSTORE_PATH=$RUNNER_TEMP/hyperdex-release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Signed & R8-Hardened Release APK (Kotlin + C11 + C++20 + Rust)
        env:
          HYPERDEX_BUILD_PEPPER: ${{ secrets.OFFICIAL_HMAC_PEPPER }}
        run: |
          gradle --no-daemon clean assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HyperDeX-release.apk
          rm -f "$RUNNER_TEMP/hyperdex-release.p12"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperDeX-release-apk
          path: app/build/outputs/apk/release/HyperDeX-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/HyperDeX-release.apk
